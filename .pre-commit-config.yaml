---
repos:
  - repo: https://github.com/adrienverge/yamllint.git
    rev: v1.33.0
    hooks:
      - id: yamllint

  # Run ansible-lint from the pixi-managed env so it works from any shell
  - repo: local
    hooks:
      - id: ansible-lint
        name: ansible-lint
        entry: pixi run ansible-lint --profile production
        language: system
        files: \.(yaml|yml)$
