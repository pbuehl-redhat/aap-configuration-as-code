---
repos:
  - repo: [https://github.com/adrienverge/yamllint.git](https://github.com/adrienverge/yamllint.git)
    rev: v1.33.0
    hooks:
      - id: yamllint
        args: ['-c', '.yamllint']
        
  - repo: [https://github.com/ansible/ansible-lint.git](https://github.com/ansible/ansible-lint.git)
    rev: v6.22.1
    hooks:
      - id: ansible-lint
        args: ['--profile', 'production']

