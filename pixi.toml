[workspace]
name = "aap-configuration-as-code"
description = "Local dev tooling for AAP Configuration as Code"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64", "osx-64"]

[dependencies]
python = "3.12.*"
ansible-core = ">=2.16"
ansible-lint = "*"
yamllint = "*"
pre-commit = "*"

[tasks]
setup = "pre-commit install"

install-collections = "ansible-galaxy collection install -r execution-environment/requirements.yml"

lint-yaml = "yamllint ."
lint-ansible = "ansible-lint --profile production"
lint = { depends-on = ["lint-yaml", "lint-ansible"] }

syntax-check = "ansible-playbook -i inventory/inventory_dev.yml playbooks/deploy_cac.yml --syntax-check -e target_env=dev"

deploy-dev  = "ansible-playbook -i inventory/inventory_dev.yml  playbooks/deploy_cac.yml -e target_env=dev"
deploy-prod = "ansible-playbook -i inventory/inventory_prod.yml playbooks/deploy_cac.yml -e target_env=prod"
