---
- name: Quick Export of AAP Projects (Direct API Method)
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    controller_host: "{{ lookup('env', 'CONTROLLER_HOST') }}"
    token: "{{ lookup('env', 'CONTROLLER_OAUTH_TOKEN') }}"

  tasks:
    - name: Fetch all projects directly via raw API
      ansible.builtin.uri:
        url: >-
          {{ controller_host }}/api/controller/v2/job_templates/
        method: GET
        headers:
          Authorization: "Bearer {{ token }}"
        validate_certs: false
        return_content: true
      register: api_response

    - name: Save the JSON/YAML payload to a local file
      ansible.builtin.copy:
        content: >-
          {{ api_response.json.results |
             to_nice_yaml(width=50, explicit_start=true) }}
        dest: "./my_aap_projects.yml"
        mode: "0700"
