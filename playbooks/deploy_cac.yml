---
- name: Declarative AAP Configuration Deployment
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    env: "{{ target_env | default('dev') }}"
    aap_configuration_collect_logs: true

  tasks:
    - name: "Phase 1: Load Universal Baseline Configurations"
      ansible.builtin.include_vars:
        dir: "../configs/all"
        extensions: ['yml', 'yaml']
      tags: always

    - name: "Phase 2: Load Environment-Specific Overrides"
      ansible.builtin.include_vars:
        dir: "../configs/{{ env }}"
        extensions: ['yml', 'yaml']
      tags: always

    - name: "Phase 3: Merge Global and Environment Lists"
      ansible.builtin.set_fact:
        controller_organizations: >-
          {{ (controller_organizations_all | default([])) +
            (controller_organizations_env | default([])) }}

        controller_execution_environments: >-
          {{ (controller_execution_environments_all | default([])) +
            (controller_execution_environments_env | default([])) }}

        controller_inventories: >-
          {{ (controller_inventories_all | default([])) +
            (controller_inventories_env | default([])) }}

        controller_groups: >-
          {{ (controller_groups_all | default([])) +
            (controller_groups_env | default([])) }}

        controller_hosts: >-
          {{ (controller_hosts_all | default([])) +
            (controller_hosts_env | default([])) }}

        controller_inventory_sources: >-
          {{ (controller_inventory_sources_all | default([])) +
            (controller_inventory_sources_env | default([])) }}

        controller_projects: >-
          {{ (controller_projects_all | default([])) +
            (controller_projects_env | default([])) }}

        controller_job_templates: >-
          {{ (controller_job_templates_all | default([])) +
            (controller_job_templates_env | default([])) }}

        controller_workflow_job_templates: >-
          {{ (controller_workflow_job_templates_all | default([])) +
            (controller_workflow_job_templates_env | default([])) }}

        controller_roles: >-
          {{ (controller_roles_all | default([])) +
            (controller_roles_env | default([])) }}
      tags: always

    - name: "Phase 4: Dispatch Configuration to AAP API"
      ansible.builtin.include_role:
        name: ansible.platform.dispatch
      tags: dispatch

    - name: "Phase 5: Output Consolidated Execution Logs"
      ansible.builtin.debug:
        var: ansible_platform_role_errors
      when:
        - ansible_platform_role_errors is defined
        - ansible_platform_role_errors | length > 0
