---
name: AAP CaC Pipeline

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

# Concurrency group to prevent overlapping runs on the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}/johnlucca-ee

jobs:
  lint:
    name: Linting & Code Quality
    runs-on: ubuntu-latest
    container:
      image: quay.io/ansible/creator-ee:latest
    steps:
      - uses: actions/checkout@v4
      - run: yamllint configs/
      - run: ansible-lint playbooks/deploy_cac.yml

  build_ee:
    name: Build Execution Environment
    needs: [lint]
    runs-on: [ubuntu-latest]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with: {python-version:'3.10'}
      - name: Install ansible-builder
        run: pip install ansible-builder

      # 1. Build the EE locally with ansible-builder using podman
      - name: Build EE Image
        run: |
          cd execution-environment
          sed -i "/auth_url/a token=${{ secrets.AH_TOKEN }}" ansible.cfg
          ansible-builder build -t ${{ env.IMAGE_NAME }}:${{ github.sha }} --container-runtime podman

      # 2. Execute the Push-to-PAH Script
      - name: Push to Private Automation Hub
        run: |
          cd execution-environment
          chmod +x push_to_pah.sh
          ./push_to_pah.sh
        env:
          # Tell the script exactly which image we just built
          LOCAL_IMAGE: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          # Force Podman as the runtime for RHEL runners
          CONTAINER_RUNTIME: "podman"
          # Hub Configuration (Configure these as Secrets/Variables in GitHub)
          PAH_REGISTRY: ${{ vars.PAH_REGISTRY }}
          PAH_NAMESPACE: "johnlucca"
          PAH_IMAGE_NAME: "johnlucca-ee"
          PAH_USERNAME: ${{ secrets.PAH_USERNAME }}
          PAH_PASSWORD: ${{ secrets.PAH_PASSWORD }}
          PAH_TLS_VERIFY: "false"

      # 3. Fallback/Backup: Also push to GHCR using podman
      - name: Log in to GHCR & Push Backup
        run: |
          podman login ghcr.io -u ${{ github.actor }} -p ${{ secrets.GITHUB_TOKEN }}
          podman push ${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Push Latest Tag (Main branch only)
        if: github.ref == 'refs/heads/main'
        run: |
          podman tag ${{ env.IMAGE_NAME }}:${{ github.sha }} ${{ env.IMAGE_NAME }}:latest
          podman push ${{ env.IMAGE_NAME }}:latest

  dry_run_validation:
    name: Dry-Run API Simulation
    needs: build_ee
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/${{ github.repository }}/johnlucca-ee:${{ github.sha }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - run: |
          ansible-playbook -i inventory/inventory_dev.yml playbooks/deploy_cac.yml \
            -e "target_env=dev" \
            -e "ee_image_tag=${{ github.sha }}" \
            --check

  deploy_development:
    name: Declarative Deployment - DEV
    needs: dry_run_validation
    if: github.ref != 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: development
    container:
      image: ghcr.io/${{ github.repository }}/johnlucca-ee:${{ github.sha }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - run: |
          ansible-playbook -i inventory/inventory_dev.yml playbooks/deploy_cac.yml \
            -e "target_env=dev" \
            -e "ee_image_tag=${{ github.sha }}"
        env:
          CONTROLLER_HOST: ${{ secrets.DEV_CONTROLLER_HOST }}
          CONTROLLER_OAUTH_TOKEN: ${{ secrets.DEV_CONTROLLER_OAUTH_TOKEN }}
          CONTROLLER_VERIFY_SSL: "false"

  deploy_production:
    name: Declarative Deployment - PROD
    needs: dry_run_validation
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: production
    container:
      image: ghcr.io/${{ github.repository }}/johnlucca-ee:${{ github.sha }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - run: |
          ansible-playbook -i inventory/inventory_prod.yml playbooks/deploy_cac.yml \
            -e "target_env=prod"
        env:
          CONTROLLER_HOST: ${{ secrets.PROD_CONTROLLER_HOST }}
          CONTROLLER_OAUTH_TOKEN: ${{ secrets.PROD_CONTROLLER_OAUTH_TOKEN }}
          CONTROLLER_VERIFY_SSL: "true"
