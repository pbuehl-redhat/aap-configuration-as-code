---
name: AAP CaC Pipeline

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

# Concurrency group to prevent overlapping runs on the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}/johnlucca-ee

jobs:
  lint:
    name: Linting & Code Quality
    runs-on: ubuntu-latest
    container:
      image: quay.io/ansible/creator-ee:latest
    steps:
      - uses: actions/checkout@v4
      - run: yamllint configs/
      - run: ansible-lint playbooks/deploy_cac.yml

  build_ee:
    name: Build Execution Environment
    needs: [lint]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install ansible-builder
        run: pip install ansible-builder
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push EE Image (SHA Tag)
        run: |
          cd execution-environment
          ansible-builder build \
            --build-arg ANSIBLE_GALAXY_SERVER_AUTOMATION_HUB_TOKEN=${{ secrets.AH_TOKEN }} \
            -t ${{ env.IMAGE_NAME }}:${{ github.sha }}
          docker push ${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Push Latest Tag (Main branch only)
        if: github.ref == 'refs/heads/main'
        run: |
          docker tag ${{ env.IMAGE_NAME }}:${{ github.sha }} ${{ env.IMAGE_NAME }}:latest
          docker push ${{ env.IMAGE_NAME }}:latest

  dry_run_validation:
    name: Dry-Run API Simulation
    needs: build_ee
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/${{ github.repository }}/johnlucca-ee:${{ github.sha }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - run: |
          ansible-playbook -i inventory/inventory_dev.yml playbooks/deploy_cac.yml \
            -e "target_env=dev" \
            -e "ee_image_tag=${{ github.sha }}" \
            --check

  deploy_development:
    name: Declarative Deployment - DEV
    needs: dry_run_validation
    if: github.ref != 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: development
    container:
      image: ghcr.io/${{ github.repository }}/johnlucca-ee:${{ github.sha }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - run: |
          ansible-playbook -i inventory/inventory_dev.yml playbooks/deploy_cac.yml \
            -e "target_env=dev" \
            -e "ee_image_tag=${{ github.sha }}"
        env:
          CONTROLLER_HOST: ${{ secrets.DEV_CONTROLLER_HOST }}
          CONTROLLER_OAUTH_TOKEN: ${{ secrets.DEV_CONTROLLER_OAUTH_TOKEN }}
          CONTROLLER_VERIFY_SSL: "false"

  deploy_production:
    name: Declarative Deployment - PROD
    needs: dry_run_validation
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: production
    container:
      image: ghcr.io/${{ github.repository }}/johnlucca-ee:${{ github.sha }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - run: |
          ansible-playbook -i inventory/inventory_prod.yml playbooks/deploy_cac.yml \
            -e "target_env=prod"
        env:
          CONTROLLER_HOST: ${{ secrets.PROD_CONTROLLER_HOST }}
          CONTROLLER_OAUTH_TOKEN: ${{ secrets.PROD_CONTROLLER_OAUTH_TOKEN }}
          CONTROLLER_VERIFY_SSL: "true"
