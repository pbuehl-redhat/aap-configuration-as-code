---
name: AAP CaC Pipeline

"on":
  push:
    branches:
      - '**'
  workflow_dispatch:
  pull_request:
    branches:
      - '**'

# Concurrency group to prevent overlapping runs on the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GH_IMAGE_NAME: ghcr.io/${{ github.repository }}/cac-ee
  AAP_IMAGE_NAME: aap-aap.apps.cluster-wf7cj-1.dynamic.redhatworkshops.io/cac-ee

jobs:
  lint:
    name: Linting & Code Quality
    runs-on: ubuntu-latest
    container:
      image: quay.io/ansible/creator-ee:latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Ansible collections
        env:
          AH_TOKEN: ${{ secrets.AH_TOKEN }}
        run: |
          cat > ansible.cfg <<EOF
          [galaxy]
          server_list = automation_hub
          [galaxy_server.automation_hub]
          url=https://console.redhat.com/api/automation-hub/content/published/
          auth_url=https://sso.redhat.com/auth/realms/redhat-external/protocol/openid-connect/token
          token=$AH_TOKEN
          EOF
          ansible-galaxy collection install -r execution-environment/requirements.yml
      - run: yamllint configs/
      - run: ansible-lint playbooks/deploy_cac.yml

  build_ee:
    name: Build Execution Environment
    needs: [lint]
    runs-on: [ubuntu-latest]
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ansible-builder
        run: pip install ansible-builder

      - name: Log in to Red Hat Registry to pull base image
        uses: docker/login-action@v3
        with:
          registry: registry.redhat.io
          username: ${{ secrets.RH_REGISTRY_USERNAME }}
          password: ${{ secrets.RH_REGISTRY_PASSWORD }}

      - name: Log in to Private Automation Hub
        uses: docker/login-action@v3
        with:
          registry: https://aap-aap.apps.cluster-wf7cj-1.dynamic.redhatworkshops.io
          username: ${{ secrets.PAH_USERNAME }}
          password: ${{ secrets.PAH_PASSWORD }}

      - name: Create Ansible Auth Files
        working-directory: execution-environment
        env:
          AH_TOKEN: ${{ secrets.AH_TOKEN }}
        run: |
          cat <<EOF > ansible.cfg
          [galaxy]
          server_list = published, validated, release

          [galaxy_server.published]
          url=https://console.redhat.com/api/automation-hub/content/published/
          auth_url=https://sso.redhat.com/auth/realms/redhat-external/protocol/openid-connect/token
          token=$AH_TOKEN

          [galaxy_server.validated]
          url=https://console.redhat.com/api/automation-hub/content/validated/
          auth_url=https://sso.redhat.com/auth/realms/redhat-external/protocol/openid-connect/token
          token=$AH_TOKEN

          [galaxy_server.release]
          url=https://galaxy.ansible.com/
          EOF

      - name: Build Execution Environment
        working-directory: execution-environment
        run: |
          ansible-builder build -t ${{ env.GH_IMAGE_NAME }}:${{ github.sha }}

      - name: Verify Image
        run: |
          podman images | grep cac-ee

      - name: Log in to GHCR & Push Backup
        run: |
          podman login ghcr.io -u ${{ github.actor }} -p ${{ secrets.GITHUB_TOKEN }}
          podman push ${{ env.GH_IMAGE_NAME }}:${{ github.sha }}
          podman tag ${{ env.GH_IMAGE_NAME }}:${{ github.sha }} ${{ env.AAP_IMAGE_NAME }}:${{ github.sha }}
          podman push ${{ env.AAP_IMAGE_NAME }}:${{ github.sha }}

      - name: Push Latest Tag (Main branch only)
        if: github.ref == 'refs/heads/main'
        run: |
          podman tag ${{ env.GH_IMAGE_NAME }}:${{ github.sha }} ${{ env.AAP_IMAGE_NAME }}:latest
          podman push ${{ env.AAP_IMAGE_NAME }}:latest

  dry_run_validation:
    name: Dry-Run API Simulation
    needs: build_ee
    runs-on: ubuntu-latest
    environment: development
    container:
      image: ghcr.io/${{ github.repository }}/cac-ee:${{ github.sha }}
      options: --user root
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - run: |
          ansible-playbook -i inventory/inventory_dev.yml playbooks/deploy_cac.yml \
            -e "target_env=dev" \
            -e "ee_image_tag=${{ github.sha }}" \
            --syntax-check
        env:
          CONTROLLER_HOST: ${{ secrets.DEV_CONTROLLER_HOST }}
          CONTROLLER_OAUTH_TOKEN: ${{ secrets.DEV_CONTROLLER_OAUTH_TOKEN }}
          CONTROLLER_VERIFY_SSL: "false"

  deploy_development:
    name: Declarative Deployment - DEV
    needs: dry_run_validation
    if: github.ref != 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: development
    container:
      image: ghcr.io/${{ github.repository }}/cac-ee:${{ github.sha }}
      options: --user root
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - run: |
          ansible-playbook -i inventory/inventory_dev.yml playbooks/deploy_cac.yml \
            -e "target_env=dev" \
            -e "ee_image_tag=${{ github.sha }}"
        env:
          IMAGE_NAME: ghcr.io/pbuehl-redhat/aap-configuration-as-code/cac-ee
          CONTROLLER_HOST: ${{ secrets.DEV_CONTROLLER_HOST }}
          CONTROLLER_OAUTH_TOKEN: ${{ secrets.DEV_CONTROLLER_OAUTH_TOKEN }}
          CONTROLLER_VERIFY_SSL: "false"
          ANSIBLE_ASYNC_DIR: /tmp/.ansible_async

  deploy_production:
    name: Declarative Deployment - PROD
    needs: dry_run_validation
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: production
    container:
      image: ghcr.io/${{ github.repository }}/cac-ee:${{ github.sha }}
      options: --user root
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - run: |
          ansible-playbook -i inventory/inventory_prod.yml playbooks/deploy_cac.yml \
            -e "target_env=prod"
        env:
          IMAGE_NAME: ghcr.io/pbuehl-redhat/aap-configuration-as-code/cac-ee
          CONTROLLER_HOST: ${{ secrets.PROD_CONTROLLER_HOST }}
          CONTROLLER_OAUTH_TOKEN: ${{ secrets.PROD_CONTROLLER_OAUTH_TOKEN }}
          CONTROLLER_VERIFY_SSL: "true"
          ANSIBLE_ASYNC_DIR: /tmp/.ansible_async
