---
name: Build Ansible Execution Environment

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ansible-builder
        run: pip install ansible-builder

      - name: Create ansible.cfg for Automation Hub Auth
        # We generate the ansible.cfg here so the token isn't stored in source control.
        # ansible-builder will automatically pick this up during the build process.
        env:
          AH_TOKEN: ${{ secrets.AH_TOKEN }}
        run: |
          cat <<EOF > ansible.cfg
          [galaxy]
          server_list = automation_hub, release

          [galaxy_server.automation_hub]
          url=https://cloud.redhat.com/api/automation-hub/
          auth_url=https://sso.redhat.com/auth/realms/redhat-external/protocol/openid-connect/token
          token=$AH_TOKEN

          [galaxy_server.release]
          url=https://galaxy.ansible.com/
          EOF

      - name: Build Execution Environment
        run: |
          ansible-builder build -t my-custom-ee:latest -v 3

      - name: Verify Image
        run: |
          docker images | grep my-custom-ee

