---
name: Build Ansible Execution Environment

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ansible-builder
        run: pip install ansible-builder

      - name: Log in to Red Hat Registry
        uses: docker/login-action@v3
        with:
          registry: https://aap-aap.apps.cluster-wf7cj-1.dynamic.redhatworkshops.io
          username: ${{ secrets.PAH_USERNAME }}
          password: ${{ secrets.PAH_PASSWORD }}

      - name: Create Ansible Auth Files
        # Tells the runner to execute this step inside your subdirectory
        working-directory: execution-environment
        env:
          AH_TOKEN: ${{ secrets.AH_TOKEN }}
        run: |
          echo -n "$AH_TOKEN" > galaxy-rh-token
          cat <<EOF > ansible.cfg
          [galaxy]
          server_list = automation_hub, release

          [galaxy_server.automation_hub]
          url=https://cloud.redhat.com/api/automation-hub/
          auth_url=https://sso.redhat.com/auth/realms/redhat-external/protocol/openid-connect/token
          token_path=/etc/ansible/rh_token

          [galaxy_server.release]
          url=https://galaxy.ansible.com/
          EOF

      - name: Build Execution Environment
        # Runs ansible-builder inside the subdirectory where your .yml lives
        working-directory: execution-environment
        run: |
          ansible-builder build -t my-custom-ee:latest -v 3

      - name: Verify Image
        run: |
          docker images | grep my-custom-ee
