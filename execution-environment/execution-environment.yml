---
version: 3

options:
  package_manager_path: /usr/bin/microdnf

additional_build_files:
  - src: ansible.cfg
    dest: configs

images:
  base_image:
    name: registry.redhat.io/ansible-automation-platform-26/ee-minimal-rhel9:latest

dependencies:
  ansible_core:
    package_pip: ansible-core
  ansible_runner:
    package_pip: ansible-runner
  galaxy: requirements.yml
  # python: requirements-python.txt
  system: ee/bindep.txt

additional_build_steps:
  prepend_galaxy:
    - RUN mkdir -p /etc/ansible
    - COPY _build/configs/ansible.cfg /etc/ansible/ansible.cfg

  append_galaxy:
    # yamllint disable-line rule:line-length
    - RUN sed -i '/openshift-clients/d' /usr/share/ansible/collections/ansible_collections/kubernetes/core/bindep.txt || true

  append_base: |
    RUN microdnf install -y git tar && microdnf clean all
    RUN curl -fsSL https://rpm.releases.hashicorp.com/RHEL/hashicorp.repo -o /etc/yum.repos.d/hashicorp.repo
    RUN microdnf install -y terraform && microdnf clean all
    RUN curl -LO https://mirror.openshift.com/pub/openshift-v4/clients/ocp/latest/openshift-client-linux.tar.gz && \
        tar -xzf openshift-client-linux.tar.gz -C /usr/local/bin oc kubectl && \
        rm -f openshift-client-linux.tar.gz
